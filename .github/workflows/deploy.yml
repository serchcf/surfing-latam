name: Deploy SurfLatam Worker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── Lint & Validate ────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML structure
        run: |
          echo "Validating key files exist..."
          test -f public/index.html     && echo "✅ index.html"
          test -f public/assets/style.css && echo "✅ style.css"
          test -f public/assets/chat.js   && echo "✅ chat.js"
          test -f public/_headers         && echo "✅ _headers"
          test -f src/index.ts            && echo "✅ Worker entrypoint"
          test -f wrangler.toml           && echo "✅ Wrangler config"

  # ── Deploy the Worker and its static assets ────────────────────
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: validate
    # Only deploy on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker and assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deployment summary
        run: |
          echo "## 🌊 SurfLatam Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://surfing-latam.smunoz-91f.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cloudflare Services Active" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cloudflare Workers Static Assets" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Worker API (/api/chat)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Workers AI (Llama 3.1 8B Fast)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Chat DLP and 5 requests/minute rate limit" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Security headers (_headers)" >> $GITHUB_STEP_SUMMARY
